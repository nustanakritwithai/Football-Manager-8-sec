services:
  - type: web
    name: tactic-manager-lab
    runtime: static
    repo: https://github.com/nustanakritwithai/Football-Manager-8-sec
    branch: claude/ball-physics-lite-p27-k4c083
    buildCommand: echo "Static site — no build step"
    staticPublishPath: .
    headers:
      - path: /src/*
        name: Cache-Control
        value: no-cache, max-age=0
      - path: /index.html
        name: Cache-Control
        value: no-cache, max-age=0
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
